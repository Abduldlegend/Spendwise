<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolve and apply the theme before first paint so the dark default
      // never flashes light. Mirrors src/context/ThemeContext.jsx and the
      // `spendwise:theme` localStorage key.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('spendwise:theme'))
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved
          if (stored === 'light' || stored === 'dark') resolved = stored
          else if (stored === 'system') resolved = prefersDark ? 'dark' : 'light'
          else resolved = 'dark'
          document.documentElement.classList.toggle('dark', resolved === 'dark')
          document.documentElement.style.colorScheme = resolved
        } catch (error) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
    <meta
      name="description"
      content="SpendWise — bank-grade personal finance and multi-rail budgeting ledger."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <title>SpendWise — Personal Finance &amp; Liquidity Rails</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
